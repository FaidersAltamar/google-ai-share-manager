services:
  ai-share-manager:
    build: .
    container_name: ai-share-manager
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./app/sessions:/app/sessions
    networks:
      - ai-share-net
    environment:
      - TZ=America/Bogota
      - VPS_API=http://ai-share-manager:8000
      - ADB_BIN=/opt/platform-tools/platform-tools/adb
      - DIAG_PORT=19536

  worker:
    build: .
    container_name: ai-share-worker
    restart: unless-stopped
    volumes:
      - ./app/sessions:/app/sessions
    networks:
      - ai-share-net
    environment:
      - TZ=America/Bogota
      - VPS_API=http://ai-share-manager:8000
      - ADB_BIN=/opt/platform-tools/platform-tools/adb
      - DIAG_PORT=19537
    command: python -u /app/worker_fox.py

networks:
  ai-share-net:
    name: ai-share-net
    driver: bridge
